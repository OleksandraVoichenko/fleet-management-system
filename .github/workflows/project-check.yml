name: Project Structure Check

on:
  push:
  pull_request:

jobs:
  check-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          test -f README.md
          test -f .gitignore
          test -d src
          test -d docs
          test -d tests
          echo "Project structure is valid"