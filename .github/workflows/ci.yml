name: Fleet Management CI

on:
  push:
    branches:
      - master
      - feature/ci-pipeline
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Node.js version
        run: node --version

      - name: Run automated tests
        run: node --test